<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TrailQuest - Register</title><link rel="stylesheet" href="style.css"></head>
<body>
    <header><h1>TrailQuest</h1><p>Treks That Transform Lives</p><nav><a href="home.html">Home</a><a href="treks.html">Treks</a><a href="destinations.html">Destinations</a><a href="gallery.html">Gallery</a><a class="active" href="trekregister.html">Register</a><a href="login.html">Login</a><a href="contact.html">Contact</a></nav></header>
    <main>
        <section class="page-title"><h2>Trek Registration</h2><p>Fill in this form to register your interest in a TrailQuest trek.</p></section>
        <section class="section">
            <form onsubmit="registerTrek(event)">
                <fieldset>
                    <legend>Personal Information</legend>
                    <label for="name">Full Name:</label><input id="name" type="text" placeholder="Enter your full name" required>
                    <label for="email">Email:</label><input id="email" type="email" placeholder="Enter your email address" required>
                    <label for="phone">Phone Number:</label><input id="phone" type="tel" placeholder="Enter your phone number" required>
                </fieldset>
                <fieldset>
                    <legend>Trek Details</legend>
                    <label for="trek">Trek Selection:</label>
                    <select id="trek" required><option value="">-- Select a Trek --</option><option>Hampta Pass</option><option>Valley of Flowers</option><option>Kedarkantha Trek</option><option>Kudremukh</option><option>Skandagiri</option></select>
                    <label>Trekking Experience:</label>
                    <label class="choice"><input type="radio" name="experience" value="Beginner" required> Beginner</label>
                    <label class="choice"><input type="radio" name="experience" value="Intermediate"> Intermediate</label>
                    <label class="choice"><input type="radio" name="experience" value="Advanced"> Advanced</label>
                    <label>Interests:</label>
                    <label class="choice"><input type="checkbox" name="interest" value="Hiking"> Hiking</label>
                    <label class="choice"><input type="checkbox" name="interest" value="Camping"> Camping</label>
                    <label class="choice"><input type="checkbox" name="interest" value="Photography"> Photography</label>
                </fieldset>
                <button class="button" type="submit">Register</button>
                <button class="button" type="reset">Clear</button>
            </form>
        </section>
    </main>
    <footer><p>© 2026 TrailQuest · Explore Beyond</p></footer>
    <script>
        function registerTrek(event) {
            event.preventDefault();
            alert("Registration successful! We will contact you soon.");
            window.location.href = "home.html";
        }
    </script>
</body>
</html>
